<!DOCTYPE html>
<html lang="ru">
<head>

<title>Isaac Arena — 2 vs 3</title>
<style>
  html,body{margin:0;height:100%;background:#05040a;overflow:hidden;

    flex-direction:column;gap:8px;background:#05040a;color:#e8dcc8;z-index:5;letter-spacing:2px}
  #boot b{font-size:18px;letter-spacing:4px}
  #boot span{color:#7a6f63;font-size:11px;letter-spacing:1px}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="480" height="270"></canvas></div>
<div id="boot"><b>ISAAC ARENA</b><span>2 Айзека против 3 монстров — загрузка…</span></div>
